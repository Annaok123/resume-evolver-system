<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> — 简历</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f5f5f5;
            --text: #1a1a1a;
            --text-muted: #666;
            --accent: #0066cc;
            --border: #ddd;
            --tag-bg: #e8f4ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            max-width: 860px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .header { text-align: center; margin-bottom: 48px; }
        .name { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; }
        .title { font-size: 1.1rem; color: var(--accent); margin: 8px 0; }
        .contact { font-size: 0.9rem; color: var(--text-muted); margin-top: 12px; }
        .summary {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 640px;
            margin: 0 auto 40px;
            text-align: center;
        }
        section { margin-bottom: 48px; }
        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .job-card, .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px;
        }
        .job-title { font-size: 1.05rem; font-weight: 600; }
        .job-period { font-size: 0.85rem; color: var(--text-muted); }
        .job-company { font-size: 0.9rem; color: var(--accent); margin: 4px 0 12px; }
        .job-bullets, .project-bullets { list-style: none; }
        .job-bullets li, .project-bullets li {
            padding: 3px 0;
            padding-left: 16px;
            position: relative;
            font-size: 0.95rem;
        }
        .job-bullets li::before, .project-bullets li::before {
            content: "▸";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 0.8em;
        }
        .project-name { font-weight: 600; font-size: 1rem; }
        .project-meta { font-size: 0.85rem; color: var(--accent); margin: 4px 0 12px; }
        .skill-group { margin-bottom: 16px; }
        .skill-group-name {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .skill-tag {
            background: var(--tag-bg);
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 0.85rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 60px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        @media (max-width: 600px) {
            .name { font-size: 1.8rem; }
            body { padding: 40px 16px; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="name"></div>
    <div class="title"></div>
    <div class="contact"></div>
</header>



<section>
    <h2>💼 工作经历</h2>
    <p style="color:var(--text-muted)">请在 data/resume.md 中填写工作经历</p>
</section>

<section>
    <h2>🚀 项目经验</h2>
    <p style="color:var(--text-muted)">请在 data/resume.md 中填写项目经验</p>
</section>

<section>
    <h2>🛠️ 技能清单</h2>
    <p style="color:var(--text-muted)">请在 data/resume.md 中填写技能</p>
</section>

<footer class="footer">
    由 <a href="https://github.com/openclaw">Resume Evolver Agent</a> 提供支持 ·
    最后更新: 2026-07-23 14:25
</footer>

</body>
</html>
